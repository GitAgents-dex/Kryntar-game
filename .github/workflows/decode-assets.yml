name: Decode assets
on:
  push:
    paths:
      - '**/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          find . -name '*.b64' -not -path './.git/*' | while read -r f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
      - name: Commit decoded assets
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode base64 assets into images"
          git push
